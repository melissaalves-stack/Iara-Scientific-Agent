# Publica o painel em modo demonstração no GitHub Pages.
# Ative uma vez em: Settings > Pages > Source: GitHub Actions
name: Demo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build:demo
        working-directory: web-curator-panel
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-curator-panel/dist
      - id: deploy
        uses: actions/deploy-pages@v4
