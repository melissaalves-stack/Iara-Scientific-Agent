# Sobe o sistema completo:
#   docker compose up --build
# Painel web:  http://localhost:8080
# API (docs):  http://localhost:8000/docs

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iara
      POSTGRES_PASSWORD: iara
      POSTGRES_DB: iara
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iara"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend-agents
    environment:
      DATABASE_URL: postgresql+psycopg2://iara:iara@db:5432/iara
      UPLOAD_DIR: /app/uploads
      # Opcional: LLM local via Ollama (descomente e rode o Ollama no computador)
      # LLM_BASE_URL: http://host.docker.internal:11434/v1
      # LLM_MODEL: llama3.2
    volumes:
      - fotos:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./web-curator-panel
    ports:
      - "8080:80"
    depends_on:
      - backend

  # Roda uma vez: simula o app Android enviando 5 relatos coletados offline.
  # Pode rodar de novo sem duplicar nada (o sync é idempotente).
  simulador:
    build: ./backend-agents
    command: python /scripts/simulate_expedition.py --api http://backend:8000
    volumes:
      - ./scripts:/scripts
    restart: "no"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  dados_postgres:
  fotos:
